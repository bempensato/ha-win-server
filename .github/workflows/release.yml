name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0 or v1.1.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve tag and version
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          # HA Win Server's own version, distinct from Home Assistant's
          # calendar version tracked by UpdateChecker. "v1.3.0" or
          # "v1.4.0-beta.1" -> informational "1.3.0" / "1.4.0-beta.1",
          # matching AppVersion.Compare's parsing on the client side.
          VERSION="${TAG#v}"

          # AssemblyVersion/FileVersion (-p:Version=) can't carry a "-beta.1"
          # suffix - only the numeric MAJOR.MINOR.PATCH core.
          VERSION_NUM="${VERSION%%-*}"

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            PRERELEASE="false"
            MAKE_LATEST="true"
          fi

          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_num=$VERSION_NUM" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/HaWinServer/HaWinServer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.tag.outputs.version_num }}
          -p:InformationalVersion=${{ steps.tag.outputs.version }}

      - name: Verify published version
        shell: pwsh
        run: |
          $exe = "src/HaWinServer/bin/Release/net9.0-windows/win-x64/publish/HaWinServer.exe"
          $actual = (Get-Item $exe).VersionInfo.ProductVersion
          $expected = "${{ steps.tag.outputs.version }}"
          Write-Host "Published ProductVersion: $actual (expected: $expected)"
          if ($actual -notlike "$expected*") {
            Write-Error "Version mismatch: exe reports '$actual', tag resolved to '$expected'. The auto-update client compares against this - refusing to publish a mismatched release."
            exit 1
          }

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p out
          cp src/HaWinServer/bin/Release/net9.0-windows/win-x64/publish/HaWinServer.exe out/HaWinServer.exe
          sha256sum out/HaWinServer.exe > out/HaWinServer.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.make_latest == 'true' }}
          files: |
            out/HaWinServer.exe
            out/HaWinServer.exe.sha256
          generate_release_notes: true
